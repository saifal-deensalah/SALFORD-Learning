# Local integration stack. Production needs TLS, private ingress, least-privilege
# DB roles, SMTP/S3 credentials and production environment validation. Billing is demo only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salford
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: salford
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salford -d salford"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: ["sh", "-c", "node dist/cli.js migrate && node dist/main.js"]
    environment: &backend_environment
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_API_ORIGIN: http://127.0.0.1:3000
      DATA_DIR: /app/.local
      DB_MODE: postgres
      DATABASE_SSL: "false"
      DATABASE_URL: postgresql://salford:${DB_PASSWORD}@postgres:5432/salford
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET:?Set a random APP_SECRET in .env}
      MAIL_MODE: local
      STORAGE_MODE: local
      IN_PROCESS_WORKER: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - backend_data:/app/.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment: *backend_environment
    volumes:
      - backend_data:/app/.local
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  backend_data:
